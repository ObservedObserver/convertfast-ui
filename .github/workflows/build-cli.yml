name: Verify CLI and templates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.19.0', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn typecheck
      - run: yarn test
      - run: yarn workspace @convertfast/registry test
      - run: yarn workspace template-app build
      - run: yarn workspace template-app lint
      - run: yarn workspace segments build
      - run: yarn workspace segments lint
      - name: Verify the npm tarball in six Next.js projects
        if: matrix.node == '22'
        run: yarn test:release
      - uses: actions/upload-artifact@v4
        if: always() && matrix.node == '22'
        with:
          name: release-validation
          path: .release/
          include-hidden-files: true
          if-no-files-found: ignore
